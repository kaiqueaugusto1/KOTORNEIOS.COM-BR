<script>
(function(){
var LK='ko-torneios-v1';
var LET='ABCDEFGHIJKL';
var DEFPTS=[100,80,65,55,45,40,35,30,25,20,15,10];
var MODS=['Futevôlei','Beach tennis','Vôlei de praia','Padel','Tênis','Outra'];
var UNITS={duplas:{s:'Dupla',p:'Duplas',pl:'duplas'},jogadores:{s:'Jogador',p:'Jogadores',pl:'jogadores'},times:{s:'Time',p:'Times',pl:'times'}};
var FASES={
  grupos:{nome:'Grupos e mata-mata',desc:'Fase de grupos, todos contra todos, e depois chave eliminatória com oitavas, quartas, semifinal e final conforme o número de classificados.'},
  direto:{nome:'Só mata-mata',desc:'Chave eliminatória direta. Quando o número de participantes não completa a chave, os melhores cabeças de chave avançam direto.'},
  pontos:{nome:'Pontos corridos',desc:'Todos contra todos em um grupo único. Vence quem tiver mais vitórias, com o saldo de games como desempate.'}
};
var env={mode:'',role:'viewer',uid:null,ready:false,forceRO:false,tentative:false};
var Store=null,IDX={},NAMES={},LIGAS={},userApi=null;
var view={page:'home',uid:null,tid:null,tab:'grupos'};
var S=null,lastSer='',ui={};
var unsubT=null,unsubL=null,unsubI=null,wt=null,wbusy=false,wdirty=false,lt=null;

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(s,r){return (r||document).querySelector(s)}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2600)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function lines(t){return String(t||'').split(/\n/).map(function(x){return x.trim()}).filter(Boolean)}
function num(v){v=String(v).trim();return v===''?'':(/^\d+$/.test(v)?String(+v):v)}
function valid(r){return r&&r.a!==''&&r.b!==''&&r.a!=null&&r.b!=null&&r.a!==r.b&&!isNaN(r.a)&&!isNaN(r.b)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function fmtDate(iso){var p=String(iso||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:String(iso||'')}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function main(h){$('#main').innerHTML=h}

/* ---------- armazenamento: banco compartilhado ou local ---------- */
function dbStore(db){
  var tp=function(u,t){return 'criadores/'+u+'/torneios/'+t};
  var lp=function(u){return 'criadores/'+u+'/liga/main'};
  return {
    watchIndex:function(cb){return db.collection('indice').onSnapshot(function(s){var m={};s.docs.forEach(function(d){m[d.id]=clone(d.data()||{})});cb(m)},function(){})},
    setIndex:function(u,data){return db.doc('indice/'+u).set(data)},
    watchT:function(u,t,cb){return db.doc(tp(u,t)).onSnapshot(function(s){cb(s.exists?clone(s.data()):null)},function(){})},
    setT:function(u,t,data){return db.doc(tp(u,t)).set(data)},
    delT:function(u,t){return db.doc(tp(u,t)).delete()},
    watchLiga:function(u,cb){return db.doc(lp(u)).onSnapshot(function(s){cb(s.exists?clone(s.data()):null)},function(){})},
    setLiga:function(u,data){return db.doc(lp(u)).set(data)}
  };
}
function localStore(){
  var D;try{D=JSON.parse(localStorage.getItem(LK))}catch(e){D=null}
  if(!D)D={indice:{},t:{},liga:{}};
  var W=[];
  function persist(){try{localStorage.setItem(LK,JSON.stringify(D))}catch(e){}}
  function emit(k,key){W.slice().forEach(function(w){if(w.k===k&&(key==null||w.key===key))w.fire()})}
  function watch(k,key,get,cb){var w={k:k,key:key,fire:function(){cb(get())}};W.push(w);setTimeout(w.fire,0);return function(){W=W.filter(function(x){return x!==w})}}
  return {
    watchIndex:function(cb){return watch('i','',function(){return clone(D.indice)},cb)},
    setIndex:function(u,data){D.indice[u]=clone(data);persist();emit('i','');return Promise.resolve()},
    watchT:function(u,t,cb){return watch('t',t,function(){return D.t[t]?clone(D.t[t]):null},cb)},
    setT:function(u,t,data){D.t[t]=clone(data);persist();emit('t',t);return Promise.resolve()},
    delT:function(u,t){delete D.t[t];persist();emit('t',t);return Promise.resolve()},
    watchLiga:function(u,cb){return watch('l',u,function(){return D.liga[u]?clone(D.liga[u]):null},cb)},
    setLiga:function(u,data){D.liga[u]=clone(data);persist();emit('l',u);return Promise.resolve()}
  };
}

/* ---------- armazenamento: servidor próprio (API /api/ko) ---------- */
function srvStore(){
  var D={indice:{},t:{},liga:{}},W=[],pend=0,seq=0,pulling=false;
  var tk=function(){try{return localStorage.getItem('ko-token')||''}catch(e){return ''}};
  function emit(k,key){W.slice().forEach(function(w){if(w.k===k&&(key==null||w.key===key))w.fire()})}
  function watch(k,key,get,cb){var w={k:k,key:key,fire:function(){cb(get())}};W.push(w);setTimeout(w.fire,0);return function(){W=W.filter(function(x){return x!==w})}}
  function same(a,b){return JSON.stringify(a)===JSON.stringify(b)}
  function send(method,url,body){
    pend++;seq++;
    return fetch(url,{method:method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+tk()},body:body===undefined?undefined:JSON.stringify(body)})
      .then(function(r){
        if(r.status===401||r.status===403){var e=new Error('nao autorizado');e.code='not_granted';throw e}
        if(r.status===413){var q=new Error('grande demais');q.code='quota_exceeded';throw q}
        if(!r.ok)throw new Error('http '+r.status);
        return r.json();
      })
      .then(function(x){pend--;return x},function(e){pend--;throw e});
  }
  function pull(){
    if(pulling||pend>0)return Promise.resolve();
    var a=document.activeElement;
    if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')&&env.role!=='viewer')return Promise.resolve();
    pulling=true;var my=seq;
    return fetch('/api/ko/estado',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('http');return r.json()}).then(function(s){
      pulling=false;
      if(pend>0||my!==seq)return;
      var nm=s.nomes||{},chn=false;
      Object.keys(nm).forEach(function(k){if(NAMES[k]!==nm[k]){NAMES[k]=nm[k];chn=true}});
      if(chn)emit('i','');

function sizesOf(N,ng){var o=[],b=Math.floor(N/ng),r=N%ng;for(var g=0;g<ng;g++)o.push(b+(g<r?1:0));return o}

var rrC={};
function rr(n){
  if(rrC[n])return rrC[n];
  var t=[],out=[],i,r;for(i=0;i<n;i++)t.push(i);if(n%2)t.push(-1);var m=t.length;
  for(r=0;r<m-1;r++){for(i=0;i<m/2;i++){var a=t[i],b=t[m-1-i];if(a>=0&&b>=0)out.push([Math.min(a,b),Math.max(a,b)])}t.splice(1,0,t.pop())}
  return rrC[n]=out;
}
function GN(){var o=[];for(var i=0;i<S.cfg.ng;i++)o.push(LET[i]);return o}
function gmKey(g,i){return g+':'+i}

/* ---------- classificação dos grupos ---------- */
function standings(g){
  var ds=groupDuplas(g),pairs=rr(ds.length),m={},res=[];
  ds.forEach(function(d){m[d.id]={d:d,j:0,v:0,pro:0,con:0,g:g}});
  pairs.forEach(function(p,i){
    var A=ds[p[0]],B=ds[p[1]];if(!A||!B)return;
    var r=S.gm[gmKey(g,i)];if(!valid(r))return;
    var a=+r.a,b=+r.b;
    m[A.id].j++;m[B.id].j++;m[A.id].pro+=a;m[A.id].con+=b;m[B.id].pro+=b;m[B.id].con+=a;
    if(a>b)m[A.id].v++;else m[B.id].v++;
    res.push({w:a>b?A.id:B.id,l:a>b?B.id:A.id});
  });
  var rows=ds.map(function(d){var x=m[d.id];x.saldo=x.pro-x.con;return x});
  function h2h(x,y){var r=res.filter(function(z){return (z.w===x.d.id&&z.l===y.d.id)||(z.w===y.d.id&&z.l===x.d.id)})[0];
    if(!r)return 0;return r.w===x.d.id?-1:1}
  rows.sort(function(x,y){
    return (y.v-x.v)||(y.saldo-x.saldo)||(y.pro-x.pro)||h2h(x,y)||((+x.d.tb||0)-(+y.d.tb||0))||(ds.indexOf(x.d)-ds.indexOf(y.d));
  });
  rows.forEach(function(x,i){
    x.tie=false;
    [rows[i-1],rows[i+1]].forEach(function(o){
      if(o&&o.v===x.v&&o.saldo===x.saldo&&o.pro===x.pro&&!h2h(x,o)&&(+o.d.tb||0)===(+x.d.tb||0)&&x.j>0)x.tie=true});
  });
  return rows;
}
function groupDone(g){var n=groupDuplas(g).length;return n>1&&rr(n).every(function(p,i){return valid(S.gm[gmKey(g,i)])})}
function allDone(){return GN().every(function(_,g){return groupDuplas(g).length<2||groupDone(g)})}
function cmpRow(a,b){return (a.pos-b.pos)||(b.r.v-a.r.v)||(b.r.saldo-a.r.saldo)||(b.r.pro-a.r.pro)||(a.g-b.g)}
function qualifiers(){
  var seeds=[];
  if(!isGrupos()){
    allDuplas().forEach(function(d,i){seeds.push({r:{d:d,v:0,saldo:0,pro:0,j:0,g:-1-i},pos:i,g:-1-i,kind:'s'})});
    return seeds;
  }
  var k=+S.cfg.k,cand=[];
  GN().forEach(function(_,g){
    standings(g).forEach(function(r,pos){
      if(pos<k)seeds.push({r:r,pos:pos,g:g,kind:'q'});
      else if(pos===k)cand.push({r:r,pos:pos,g:g,kind:'x'});
    });
  });
  cand.sort(cmpRow);
  seeds=seeds.concat(cand.slice(0,+S.cfg.extra||0));
  seeds.sort(cmpRow);
  return seeds;
}
function qualMap(){var m={};if(isPontos())return m;qualifiers().forEach(function(s){m[s.r.d.id]=s.kind});return m}

/* ---------- chave ---------- */
function nextPow2(n){var s=2;while(s<n)s*=2;return s}
function seedOrder(n){var s=[1,2];while(s.length<n){var m=s.length*2+1;s=s.flatMap(function(x){return [x,m-x]})}return s}
function roundName(size){return {2:'Final',4:'Semifinal',8:'Quartas de final',16:'Oitavas de final',32:'16 avos de final',64:'32 avos de final'}[size]||('Fase de '+size)}
function gamesOf(m){var x=S.ko[m.id];return (x&&x.g)?x.g:[{a:'',b:''},{a:'',b:''},{a:'',b:''}]}
function tally(m){var g=gamesOf(m),wa=0,wb=0;
  for(var i=0;i<2;i++){if(valid(g[i])){if(+g[i].a>+g[i].b)wa++;else wb++}}
  var need3=(wa===1&&wb===1);
  if(need3&&valid(g[2])){if(+g[2].a>+g[2].b)wa++;else wb++}
  return {wa:wa,wb:wb,g:g,need3:need3}}
function buildBracket(){
  var seeds=qualifiers(),Q=seeds.length;
  if(Q<2)return null;
  var size=Math.max(2,nextPow2(Q)),order=seedOrder(size),k=+S.cfg.k;
  var seedIdx={};seeds.forEach(function(x,i){seedIdx[x.r.d.id]=i});
  function team(s){var x=seeds[s-1];if(!x)return null;
    var tag=(x.kind==='s')?('cabeça '+s):((x.pos+1)+'º Grupo '+LET[x.g]+(x.kind==='x'?' (melhor '+(x.pos+1)+'º)':'')+' · cabeça '+s);
    return {id:x.r.d.id,name:x.r.d.name,tag:tag,g:x.g}}
  function at(g,pos){var x=seeds.filter(function(y){return y.g===g&&y.pos===pos})[0];
    return x?{id:x.r.d.id,name:x.r.d.name,tag:(pos+1)+'º Grupo '+LET[g],g:g}:null}
  var ng=S.cfg.ng;
  var fixed=isGrupos()&&S.cfg.cross&&k===2&&!(+S.cfg.extra)&&(ng===2||ng===4||ng===8)&&Q===ng*2;
  var rounds=[],r0=[],i;
  if(fixed){
    for(var g=0;g<ng;g++){var a=at(g,0),b=at(ng-1-g,1);r0.push({id:'r0m'+g,a:a,b:b,bye:!a||!b})}
  }else{
    for(i=0;i<size/2;i++){var a2=team(order[2*i]),b2=team(order[2*i+1]);r0.push({id:'r0m'+i,a:a2,b:b2,bye:!a2||!b2})}
    if(isGrupos()){
      for(i=0;i<r0.length;i++){var m=r0[i];
        if(!m.a||!m.b||m.a.g!==m.b.g)continue;
        for(var j=0;j<r0.length;j++){if(j===i)continue;var o=r0[j];
          if(!o.a||!o.b)continue;
          if(m.a.g!==o.b.g&&o.a.g!==m.b.g){var t=m.b;m.b=o.b;o.b=t;break}
        }
      }
    }
  }
  rounds.push({size:size,ms:r0});
  var cur=r0,r=1,sz=size/2;
  var BO3=(S.cfg.bo3!==false);
  function win(m){
    if(m.bye)return m.a||m.b;
    if(!(m.a&&m.b))return null;
    if(m.bo3){var t=tally(m);return t.wa>=2?m.a:(t.wb>=2?m.b:null)}
    var x=S.ko[m.id];if(valid(x))return (+x.a>+x.b)?m.a:m.b;return null}
  function loser(m){var w=win(m);if(!w||m.bye)return null;return w.id===m.a.id?m.b:m.a}
  while(sz>=2){
    var nx=[];
    for(var q=0;q<sz/2;q++)nx.push({id:'r'+r+'m'+q,a:win(cur[2*q]),b:win(cur[2*q+1]),bye:false});
    rounds.push({size:sz,ms:nx});cur=nx;sz/=2;r++;
  }
  var fin=cur[0];fin.bo3=BO3;
  var champ=win(fin),third=null;
  if(S.cfg.third!==false&&rounds.length>=2){
    var sm=rounds[rounds.length-2].ms;
    if(sm.length===2&&!sm[0].bye&&!sm[1].bye)third={id:'third',a:loser(sm[0]),b:loser(sm[1]),bye:false};
  }
  var B={rounds:rounds,Q:Q,size:size,seeds:seeds,seedIdx:seedIdx,champ:champ,vice:loser(fin),third:third,
    thirdW:third?win(third):null,fourth:third?loser(third):null,win:win,loser:loser,fixed:fixed,
    byes:r0.filter(function(m){return m.bye}).map(function(m){return m.a||m.b})};
  B.rank=computeRanking(B);
  return B;
}
function computeRanking(B){
  if(!B.champ)return null;
  if(B.third&&!B.thirdW)return null;
  var order=[],seen={},by={};
  allDuplas().forEach(function(d){by[d.id]=d});
  function add(t){if(t&&!seen[t.id]){seen[t.id]=1;order.push(by[t.id])}}
  add(B.champ);add(B.vice);
  var nr=B.rounds.length;
  if(B.third){add(B.thirdW);add(B.fourth)}
  for(var ri=nr-2;ri>=0;ri--){
    if(B.third&&ri===nr-2)continue;
    var ls=[];B.rounds[ri].ms.forEach(function(m){var l=B.loser(m);if(l)ls.push(l)});
    ls.sort(function(a,b){return B.seedIdx[a.id]-B.seedIdx[b.id]});
    ls.forEach(add);
  }
  var rest=[];
  if(isGrupos()){
    GN().forEach(function(_,g){standings(g).forEach(function(r,pos){if(!seen[r.d.id])rest.push({r:r,pos:pos,g:g})})});
    rest.sort(cmpRow);rest.forEach(function(x){add(x.r.d)});
  }
  allDuplas().forEach(add);
  return order;
}
function finalRank(){
  if(isPontos())return groupDone(0)?standings(0).map(function(r){return r.d}):null;
  var B=buildBracket();return B?B.rank:null;
}

  }
  h+='<div class="field" style="margin-top:12px"><label class="chk"><input type="checkbox" id="seedL"'+(S.cfg.seedLeague!==false?' checked':'')+'> Espalhar os melhores da liga: os mais fortes ficam em grupos diferentes</label></div>';

  h+='<div class="row" style="margin-top:12px"><button class="b p" id="draw">'+(S.draft?'Sortear de novo':'Sortear')+'</button></div></section>';
  h+='<section class="card"><h2>Resultado do sorteio</h2>';

  if(!D)h+='<p class="hint">O resultado aparece aqui. Você confere e só depois aplica ao torneio.</p>';
  else{
    if(D.sobras.length)h+='<p class="warnbox">Sem par: '+D.sobras.map(esc).join(', ')+'. As duas listas precisam ter o mesmo tamanho para todos jogarem.</p>';
    if(D.fase==='direto'){
      h+='<ol class="dlist">'+D.duplas.map(function(d){return '<li>'+esc(d.name)+(D.seeded&&d.score>0?' <small>'+d.score+' pts na liga</small>':'')+'</li>'}).join('')+'</ol><p class="hint">Ordem = cabeças de chave, da primeira para a última.</p>';
    }else{
      h+='<div class="gp">';
      for(var g=0;g<D.ng;g++){
        h+='<div class="gbox"><h3>'+(isPontos()?'Participantes':'Grupo '+LET[g])+'</h3><ul>'+D.duplas.filter(function(d){return d.g===g}).map(function(d){return '<li>'+esc(d.name)+(D.seeded&&d.pot===1?' <small>cabeça</small>':'')+'</li>'}).join('')+'</ul></div>';
      }
      h+='</div>';
    }
    h+='<div class="row" style="margin-top:14px" id="apl">'+(hasScores()&&ui.confirmApply?'<span>Aplicar apaga os placares atuais. Continuar?</span><button class="b d" id="apply2">Sim, aplicar</button><button class="b" id="apply3">Cancelar</button>':'<button class="b p" id="apply">Aplicar ao torneio</button>')+'</div>';
  }

function doDraw(){
  var L=ligaOf(S.owner),duplas=S.unit==='duplas';
  var A=lines(S.roster.A),B=duplas?lines(S.roster.B):[],n=duplas?Math.min(A.length,B.length):A.length;
  if(n<2){toast(duplas?'Informe pelo menos 2 jogadores em cada lista':'Informe pelo menos 2 nomes');return}
  var pairs=[],i,sobras=[];
  if(duplas){
    var As=shuffle(A),Bs=shuffle(B);
    for(i=0;i<n;i++)pairs.push({name:As[i]+' e '+Bs[i],p:[As[i],Bs[i]],score:leaguePts(L,As[i])+leaguePts(L,Bs[i])});
    sobras=As.slice(n).concat(Bs.slice(n));
  }else{
    for(i=0;i<n;i++)pairs.push({name:A[i],p:[A[i]],score:leaguePts(L,A[i])});
  }
  var ng=isGrupos()?Math.max(1,Math.min(S.cfg.ng,Math.floor(n/2))):1;
  var order=shuffle(pairs);
  if(S.cfg.seedLeague!==false)order.sort(function(a,b){return b.score-a.score});
  var out=[];
  if(!isGrupos()){order.forEach(function(d){out.push({name:d.name,p:d.p,g:0,score:d.score})})}
  else{
    var cap=sizesOf(n,ng),pot,ordered=[];
    for(var s=0;s<order.length;s+=ng){
      pot=shuffle(order.slice(s,s+ng));
      var avail=[];for(var g=0;g<ng;g++)if(cap[g]>0)avail.push(g);
      avail=shuffle(avail);
      pot.forEach(function(d,j){var gg=avail[j];cap[gg]--;ordered.push({name:d.name,p:d.p,g:gg,score:d.score,pot:Math.floor(s/ng)+1})});
    }
    ordered.sort(function(a,b){return a.g-b.g});
    out=ordered;
  }
  S.draft={duplas:out,sobras:sobras,ng:ng,fase:S.cfg.fase,seeded:S.cfg.seedLeague!==false&&order.some(function(d){return d.score>0})};
  saveT();render();
}
function applyDraft(){
  var D=S.draft;if(!D)return;
  S.cfg.N=D.duplas.length;if(isGrupos())S.cfg.ng=D.ng;
  S.duplas=D.duplas.map(function(d,i){return {id:'d'+i,name:d.name,p:d.p,g:d.g,tb:0}});
  S.cfg.k=Math.max(1,Math.min(S.cfg.k,Math.floor(S.cfg.N/S.cfg.ng)));
  S.gm={};S.ko={};S.saved=null;S.draft=null;ui={};
  view.tab=isGrupos()&&!isPontos()?'grupos':(isPontos()?'grupos':'mata');
  saveT();render();window.scrollTo(0,0);toast('Sorteio aplicado ao torneio');
}

/* ---------- mata-mata ---------- */
function renderMata(){
  var B=buildBracket();
  if(!B){main('<div class="card"><h2>Chave indisponível</h2><p class="hint">É preciso ao menos 2 classificados. Ajuste em Ajustes.</p></div>');return}
  var prov=isGrupos()&&!allDone();
  var h='<div class="bar"><p>'+B.Q+' na chave de '+B.size+' ('+roundName(B.size).toLowerCase()+').';
  if(B.fixed)h+=' Cruzamento fixo: 1º de cada grupo contra o 2º do grupo oposto. Os vencedores dos dois primeiros jogos se enfrentam na semifinal 1, e os dos outros dois na semifinal 2.';
  else h+=isGrupos()?' Chave montada pela ordem geral de classificação (cabeças de chave), sem confronto de mesmo grupo na primeira rodada.':' Chave montada pela ordem do sorteio (cabeças de chave).';
  if(B.byes.length)h+=' <b>'+B.byes.length+' vaga'+(B.byes.length>1?'s diretas':' direta')+'</b> para a rodada seguinte: '+B.byes.map(function(t){return esc(t.name)}).join(', ')+'.';
  h+=' Não há empate: o placar precisa ter um vencedor.</p><span class="badge '+(prov?'warn':'ok')+'">'+(prov?'Chave provisória':'Chave definida')+'</span></div>';
  if(B.champ){
    var pod='<div class="pod">'+(B.vice?'<span>2º lugar: '+esc(B.vice.name)+'</span>':'')+(B.thirdW?'<span>3º lugar: '+esc(B.thirdW.name)+'</span>':'')+(B.fourth?'<span>4º lugar: '+esc(B.fourth.name)+'</span>':'')+'</div>';
    h+='<div class="champ"><div><span>Campeão</span><br><b>'+esc(B.champ.name)+'</b></div>'+pod+'</div>';
  }
  if(B.rank)h+=saveBox(B.rank);
  h+='<div class="bracket">';
  B.rounds.forEach(function(R,ri){
    h+='<div class="round"><h3>'+roundName(R.size)+'</h3><div class="matches">';
    R.ms.forEach(function(m,mi){h+=kmHtml(B,m,'Jogo '+(mi+1))});
    h+='</div>';
    if(ri===B.rounds.length-1&&B.third)h+='<div class="third"><h3>Disputa de 3º lugar</h3>'+kmHtml(B,B.third,'Jogo único')+'</div>';
    h+='</div>';
  });
  main(h+'</div>');

function applyCfg(id,val){
  var c=S.cfg;
  if(id==='fase'){
    c.fase=val;
    if(val==='grupos'){if(c.ng<2)c.ng=Math.max(1,Math.min(4,Math.floor(c.N/2)))}else c.ng=1;
    S.duplas=mkDuplas(c.N,c.ng,S.duplas);restructure();
  }
  else if(id==='N'){c.N=+val;c.ng=Math.max(1,Math.min(c.ng,Math.floor(c.N/2)));S.duplas=mkDuplas(c.N,c.ng,S.duplas);restructure()}
  else if(id==='ng'){c.ng=+val;S.duplas=mkDuplas(c.N,c.ng,S.duplas);restructure()}
  else if(id==='k'){c.k=+val;S.ko={}}
  else if(id==='extra'){c.extra=+val;S.ko={}}
  else if(id==='cross'){c.cross=val==='1';S.ko={}}
  else if(id==='third'){c.third=val==='1'}
  else if(id==='bo3'){c.bo3=val==='1';var Bf=buildBracket();if(Bf)delete S.ko[Bf.rounds[Bf.rounds.length-1].ms[0].id]}
  var mx=Math.max.apply(null,sizesOf(c.N,c.ng));if(c.k>mx)c.k=mx;
  if(c.extra>c.ng)c.extra=c.ng;
}

    .then(function(r){return r.json().catch(function(){return {}}).then(function(x){if(!r.ok)throw new Error(x.erro||'Erro inesperado');return x})});
}

  if(op){var p=op.dataset.open.split('|');openT(p[0],p[1]);return}
  var el=e.target.closest('button');if(!el)return;
  var id=el.id,ds=el.dataset;
  if(id==='criar'){criarTorneio();return}
  if(id==='cpy'){var tx=$('#shtxt');var v=tx.value;
    (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(function(){toast('Mensagem copiada')},function(){tx.select();toast('Selecione e copie o texto')});return}
  if(id==='shreset'){ui.shareTxt=null;renderShare();return}
  if(!S&&view.page!=='liga')return;
  if(id==='draw'){doDraw()}
  else if(id==='apply'){if(hasScores()){ui.confirmApply=true;render()}else applyDraft()}
  else if(id==='apply2'){applyDraft()}
  else if(id==='apply3'){ui.confirmApply=false;render()}
  else if(id==='savet'){saveEtapa()}
  else if(id==='nextet'){
    var nn=/ \(etapa \d+\)$/.test(S.nome)?S.nome.replace(/\d+\)$/,function(m){return (parseInt(m,10)+1)+')'}):S.nome+' (etapa 2)';
    criarTorneio({nome:nn,mod:MODS.indexOf(S.mod)>=0?S.mod:'Outra',modOutra:S.mod,unit:S.unit,fase:S.cfg.fase,N:S.cfg.N,ng:S.cfg.ng});
  }
  else if(id==='r1'){$('#rz').innerHTML='<span>Apagar todos os placares?</span><button class="b d" id="r2">Sim, apagar</button><button class="b" id="r3">Cancelar</button>'}
  else if(id==='r2'){S.gm={};S.ko={};S.saved=null;saveT();render();toast('Placares apagados')}
  else if(id==='r3'){render()}
  else if(id==='d1'){$('#dz').innerHTML='<span>Excluir este torneio?</span><button class="b d" id="d2">Sim, excluir</button><button class="b" id="d3">Cancelar</button>'}
  else if(id==='d3'){render()}
  else if(id==='d2'){
    var u=S.owner,tid=S.id;wdirty=false;clearTimeout(wt);
    Store.delT(u,tid).then(function(){return dropFromIndex(u,tid)}).then(function(){stopT();S=null;view={page:'home'};render();toast('Torneio excluído')},writeError);
  }
  else if(ds.del){ui.del=ds.del;render()}
  else if(ds.del2){var uu=view.uid,LL=ligaOf(uu);LL.etapas=LL.etapas.filter(function(x){return x.id!==ds.del2});ui.del=null;Store.setLiga(uu,clone(LL)).then(function(){render();toast('Etapa apagada')},writeError)}
  else if(ds.del3){ui.del=null;render()}
});
document.addEventListener('input',function(e){
  var el=e.target,d=el.dataset;
  if(d.nv){var n=novoState();n[d.nv]=el.value;return}
  if(el.id==='shtxt'){ui.shareTxt=el.value;var a=$('#walink');if(a)a.href='https://wa.me/?text='+encodeURIComponent(el.value);return}
  if(d.pt!==undefined){var L=ligaOf(view.uid),val=+el.value||0;if(d.pt==='part')L.part=val;else L.pts[+d.pt]=val;saveLigaSoon(view.uid);return}
  if(!S||ro())return;
  if(d.g!==undefined){
    var k=gmKey(+d.g,+d.i),r=S.gm[k]||(S.gm[k]={a:'',b:''});
    r[d.s]=num(el.value);
    var v=r.a===''||r.b===''||(/^\d+$/.test(r.a)&&/^\d+$/.test(r.b)&&r.a!==r.b);
    el.classList.toggle('inv',!v);
    saveT();paintGroup(+d.g);
  }else if(d.n){var a=S.duplas.filter(function(x){return x.id===d.n})[0];a.name=el.value;a.p=null;saveT()}
  else if(d.tb){S.duplas.filter(function(x){return x.id===d.tb})[0].tb=+el.value||0;saveT()}
  else if(d.tn){S[d.tn]=el.value;saveT()}
  else if(el.id==='rA'){S.roster.A=el.value;$('#cA').textContent=lines(el.value).length;saveT()}
  else if(el.id==='rB'){S.roster.B=el.value;$('#cB').textContent=lines(el.value).length;saveT()}
  else if(el.id==='enome'){S.etapaNome=el.value;saveT()}
});
document.addEventListener('change',function(e){
  var el=e.target,d=el.dataset;
  if(d.nv){
    var n=novoState();n[d.nv]=d.nv==='N'||d.nv==='ng'?+el.value:el.value;
    if(d.nv==='N'&&n.ng>Math.floor(n.N/2))n.ng=Math.max(1,Math.floor(n.N/2));
    if(['fase','N','mod','unit'].indexOf(d.nv)>=0)render();
    return;
  }
  if(d.sl){var lv=el.value.trim();try{localStorage.setItem('ko-link',lv)}catch(x){}ui.shareTxt=null;renderShare();return}
  if(el.id==='ligaUid'){view.uid=el.value;ui={};startLiga();render();return}
  if(!S||ro())return;
  if(d.ko){
    var id=d.ko,r;
    if(d.gi!==undefined){
      r=S.ko[id];if(!r||!r.g)r=S.ko[id]={g:[{a:'',b:''},{a:'',b:''},{a:'',b:''}]};
      r=r.g[+d.gi];
    }else r=S.ko[id]||(S.ko[id]={a:'',b:''});
    r[d.s]=num(el.value);saveT();
    if(r.a!==''&&r.b!==''&&r.a===r.b)toast('O mata-mata não aceita empate');
    renderMata();return;
  }
  if(d.tn){render();renderNav();return}
  if(d.gsel){S.duplas.filter(function(x){return x.id===d.gsel})[0].g=+el.value;restructure();saveT();render();toast('Movido. Placares apagados');return}
  if(el.id==='seedL'){S.cfg.seedLeague=el.checked;saveT();return}
  if(['fase','N','ng','k','extra','cross','third','bo3'].indexOf(el.id)>=0){
    applyCfg(el.id,el.value);
    if(!tabOk(view.tab))view.tab=defaultTab();
    saveT();render();toast('Formato atualizado');
  }
});

/* ---------- início ---------- */
function boot(){
  render();
  var C=window.claude,pu=Promise.resolve(null),pd=Promise.resolve(null);
  if(C&&C.use){pu=C.use('user').catch(function(){return null});pd=C.use('db').catch(function(){return null})}
  Promise.all([pu,pd]).then(function(r){
    var user=r[0],db=r[1];userApi=user;
    if(!db){
      if(C&&C.use){env.mode='none'}
      else if(location.protocol==='http:'||location.protocol==='https:'){return bootSrv()}
      else{env.mode='local';env.role='dono';env.uid='local';Store=localStore()}
      env.ready=true;
      if(Store)startWatch();
      render();return null;
    }
    env.mode='db';Store=dbStore(db);
    var tasks=user?[user.isOwner(),user.id(),user.can('data.write')]:[false,null,null];
    return Promise.all(tasks).then(function(x){
      var own=!!x[0],id=x[1],dw=x[2];
      env.uid=id||(own?'dono':null);
      env.role=own?'dono':((id&&dw!==false)?'criador':'viewer');
      env.tentative=!own&&dw===null&&!!id;
      env.ready=true;startWatch();render();
    });
  });
}
function bootSrv(){
  var token='';try{token=localStorage.getItem('ko-token')||''}catch(e){}
  function fallbackLocal(){env.srv=false;env.mode='local';env.role='dono';env.uid='local';Store=localStore();env.ready=true;startWatch();render()}
  env.srv=true;env.mode='db';
  var chk=token?fetch('/api/ko/eu',{headers:{'Authorization':'Bearer '+token}}).then(function(r){return r.ok?r.json():false}):Promise.resolve(false);
  return chk.catch(function(){return null}).then(function(me){
    if(me===null){fallbackLocal();return}
    if(!me&&token){try{localStorage.removeItem('ko-token')}catch(e){}}
    env.role=me?(me.papel==='dono'?'dono':'criador'):'viewer';env.uid=me?me.uid:null;
    Store=srvStore();
    return Store.pull().then(function(){env.ready=true;startWatch();render()});
  });
}
function startWatch(){
  unsubI=Store.watchIndex(function(map){
    IDX=map||{};
    resolveNames(Object.keys(IDX));
    if(view.page==='home'||view.page==='acessos'||view.page==='liga')render();else renderNav();
  });
}
boot();
})();
</script>
